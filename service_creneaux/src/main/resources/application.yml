server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: creneaux-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinique}
    username: ${DB_USER:clinique}
    password: ${DB_PASSWORD:clinique}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

services:
  medecins:
    url: ${MEDECINS_SERVICE_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html