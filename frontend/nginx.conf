server { listen 80; root /usr/share/nginx/html; index index.html;
  location /backend/medecins { proxy_pass http://medecins-service:8081/medecins; }
  location /backend/auth { proxy_pass http://medecins-service:8081/auth; }
  location /backend/creneaux { proxy_pass http://creneaux-service:8082/creneaux; }
  location /backend/rendezvous { proxy_pass http://rendez-vous-service:8000/api/rendezvous; }
  location /backend/notifications { proxy_pass http://notifications-service:8083/api/notifications; }
  location / { try_files $uri $uri/ /index.html; }
}
